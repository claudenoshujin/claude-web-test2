<!DOCTYPE html>
<html lang="zh-CN" data-claude-skin="classic" data-claude-structure="rail" data-claude-font="follow" data-claude-clawd="off" data-claude-avatars="on">
<head>
<meta charset="UTF-8">
<title>fixture · claude-web-test</title>

<!-- ============================================================
     本地验证台。

     用途：把 styles/*.css 挂在一份**照抄真实酒馆 DOM** 的静态骨架上，
     在浏览器里直接改直接看，不用打包、不用重装扩展、不用等 lulu 截图。

     DOM 来源：真实酒馆的 devtools 快照 + 交接文档 §3.2 / §3.3 的结构记录。
     凡是 CSS 选择器会命中的属性和类名，这里都要有 —— 少一个 class，
     就会出现「fixture 里对了、装上去不对」，那样这个台子就白搭了。

     踩过两次，记在这里：
      · 导航项的 id 必须和真机一致（预设=ai-config-button，API=sys-settings-button，
        角色卡=rightNavHolder）。id 对不上就落到没有 --clawd-icon 的兜底分支，
        遮罩失效露出底色 —— 表现是导航里冒出一个黑方块，而真机上根本没有。
      · .clawd-user-meta 里**只有两行文字**，没有头像。之前塞了个 .avatar>img，
        没有任何规则约束尺寸，撑成一个 190×290 的大灰块。

     ============================================================ -->
<link rel="stylesheet" href="../styles/day-pc.css">

<style>
  /* fixture 自己的东西，全部带 fx- 前缀，绝不与主题 CSS 同名。
     酒馆真实环境里 #sheld 是撑满的，这里补上。 */
  html,body{height:100%;margin:0}
  #sheld{position:absolute;inset:0;display:flex;flex-direction:column}
  #chat{flex:1;overflow-y:auto}
</style>
</head>

<body class="clawd-interactive-ready clawd-has-recents">

<!-- ============ 侧边栏 / 第一、二列 ============ -->
<div id="top-settings-holder">
  <div class="clawd-rail-brand">Claude</div>

  <div id="ai-config-button" class="drawer">
    <div class="drawer-toggle drawer-header">
      <div class="drawer-icon fa-solid fa-sliders interactable"></div>
      <div class="clawd-rail-label">预设</div>
    </div>
    <div class="drawer-content closedDrawer"></div>
  </div>
  <div id="sys-settings-button" class="drawer">
    <div class="drawer-toggle drawer-header">
      <div class="drawer-icon fa-solid fa-plug interactable"></div>
      <div class="clawd-rail-label">API</div>
    </div>
    <div class="drawer-content closedDrawer"></div>
  </div>
  <div id="advanced-formatting-button" class="drawer">
    <div class="drawer-toggle drawer-header">
      <div class="drawer-icon fa-solid fa-font interactable"></div>
      <div class="clawd-rail-label">格式化</div>
    </div>
    <div class="drawer-content closedDrawer"></div>
  </div>
  <div id="WI-SP-button" class="drawer">
    <div class="drawer-toggle drawer-header">
      <div class="drawer-icon fa-solid fa-book-atlas interactable"></div>
      <div class="clawd-rail-label">世界书</div>
    </div>
    <div class="drawer-content closedDrawer"></div>
  </div>
  <div id="user-settings-button" class="drawer">
    <div class="drawer-toggle drawer-header">
      <div class="drawer-icon fa-solid fa-user-cog interactable"></div>
      <div class="clawd-rail-label">偏好设置</div>
    </div>
    <div class="drawer-content closedDrawer"></div>
  </div>
  <div id="logo_block" class="drawer">
    <div class="drawer-toggle drawer-header">
      <div class="drawer-icon fa-solid fa-panorama interactable"></div>
      <div class="clawd-rail-label">背景</div>
    </div>
    <div class="drawer-content closedDrawer"></div>
  </div>
  <div id="extensions-settings-button" class="drawer">
    <div class="drawer-toggle drawer-header">
      <div class="drawer-icon fa-solid fa-cubes interactable"></div>
      <div class="clawd-rail-label">扩展</div>
    </div>
    <div class="drawer-content closedDrawer"></div>
  </div>
  <div id="rightNavHolder" class="drawer">
    <div class="drawer-toggle drawer-header">
      <div class="drawer-icon fa-solid fa-address-card interactable"></div>
      <div class="clawd-rail-label">角色卡</div>
    </div>
    <div class="drawer-content closedDrawer"></div>
  </div>


  <div class="clawd-rail-recents">
    <div class="clawd-rail-recents-label">Recents</div>
  </div>

  <div class="drawer" id="persona-management-button">
    <div class="drawer-toggle">
      <div class="drawer-icon fa-solid fa-face-smile"></div>
      <div class="clawd-rail-label">玩家角色</div>
      <div class="clawd-user-face"><img src="" alt=""></div>
      <div class="clawd-user-meta">
        <div class="clawd-user-name">零</div>
        <div class="clawd-user-plan">Max plan</div>
      </div>
      <div class="clawd-user-more">⌄</div>
    </div>
    <div class="drawer-content closedDrawer"></div>
  </div>
</div>

<!-- ============ 对话区 ============ -->
<div id="sheld">
  <div id="sheldheader" class="fa-solid fa-grip drag-grabber"></div>
  <div id="chat" data-swipe-threshold="60" data-swipe-unit="px" data-swipe-timeout="500" data-show-hidden-reasoning="true"></div>

  <div id="form_sheld">
    <form id="send_form" class="compact">
      <div id="qr--bar"></div>
      <div id="nonQRFormItems">
        <div id="leftSendForm">
          <div id="options_button" class="fa-solid fa-bars interactable" title="选项"></div>
          <div id="extensionsMenuButton" class="fa-solid fa-wand-magic-sparkles interactable" title="扩展"></div>
        </div>
        <textarea id="send_textarea" rows="1" placeholder="写下你的台词……"></textarea>
        <div id="rightSendForm">
          <div id="mes_stop" class="fa-solid fa-stop interactable" style="display:none"></div>
          <div id="send_but" class="fa-solid fa-paper-plane interactable"></div>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
const SEED = [
  ["ai","Elias","你把伞放在门口了。滴水的声音一直在往里走，顺着地板的木缝，一路走到我脚边。<em>他没有起身，只是把手里那本翻旧了的排练本合上，放在膝盖上。</em>\n\n这个剧场的地板是斜的，你大概没注意。所有落在门口的水，最后都会流到这张椅子底下来。三年前我修过一次，修完之后水改从另一边流，我就不修了。"],
  ["me","安河","我以为这场雨会停。走到半路才发现越下越大，回头也来不及了。"],
  ["ai","Elias","它不会。这座城市里，雨是唯一守时的演员——该来的时候一定来，该走的时候从来不走。<em>他拨了拨工作灯，光圈在幕布上晃了一下，又稳住。</em>\n\n你要是想等它停，可以坐下。这里没有别人，椅子随便挑。第七排靠边那个位置弹簧坏了，坐上去会响一声，除此之外都还行。"],
  ["me","安河","那封信呢。你上次说写完了。"],
  ["ai","Elias","还在我口袋里。<em>他拍了拍胸前的位置，没有掏出来。</em>写完之后我读了六遍，每一遍都少一句。不是我删的，是读到那儿会自己跳过去，像台词背到一半忘了词，但你知道那句原本在那儿。"],
  ["me","安河","少的是哪一句。"],
  ["ai","Elias","第一遍少的是称呼。第六遍少的是署名。中间那四遍少的东西我记不清了，因为每次都不一样。\n\n你要问我这算不算把信写坏了——我觉得不算。一封信如果读六遍都不掉字，那说明它写的是别人的事。"],
  ["me","安河","那还剩什么。"],
  ["ai","Elias","剩下一段没有人称的句子。听上去像天气预报，或者车站广播，反正是那种谁听见都可以、谁听见都不用回应的东西。"],
  ["me","安河","念给我听。就这一次。"],
  ["ai","Elias","「今晚有雨，明日转晴，风向不定。」<em>他把纸折回口袋，动作很轻，像是怕折痕再多一道。</em>\n\n你看，说出口就没什么了。刚才它还在口袋里的时候，我以为它很重。"],
  ["me","安河","你不是在写天气。"],
  ["ai","Elias","我知道。但我只学会了用这种语气讲重要的事。<em>他笑了一下，很短。</em>小时候家里也是这样——要说的话都藏在别的话里，谁先听懂谁就输了。后来我上了台，发现台词也是这么写的，就再也改不过来了。"],
  ["me","安河","那我们从别的地方开始。你为什么留在这个剧场。"],
  ["ai","Elias","因为它还没塌。<em>他抬头看了看头顶那排熄着的灯。</em>\n\n这不是玩笑。三年前隔壁那座塌了，是半夜塌的，观众席上一个人也没有，所以没上新闻。第二天我去看，瓦砾里有半张海报还贴在墙上，字都还认得出来。从那天起我就想，一个地方要是没人记得它演过什么，塌不塌其实没区别。"],
  ["me","安河","于是你替它写讣告。"],
  ["ai","Elias","我替它排了一出戏。没人来看，但灯每晚都亮，从八点到十一点，一分钟不差。<em>他把排练本又打开，翻到中间某一页，那一页写满了字又划掉大半。</em>\n\n你要是问我这有什么用，我答不上来。但你今天来了，所以今晚这三个小时不算白亮。"],
  ["me","安河","那是给谁看的。"],
  ["ai","Elias","给还在路上的人。<em>停顿。他没有看向门口，但显然在听雨声。</em>也给已经不来的人。后面这一类比前面那一类多得多，可是没办法，名单是不能删的。"],
  ["me","安河","我今天来了。"],
  ["ai","Elias","我知道。所以今晚的灯比平时亮一档。<em>他伸手把工作灯的旋钮又拧了一点，光圈铺开，照到第七排。</em>\n\n别说这句写得太像台词。我知道它像。但站在舞台上的人说什么都像台词，这是职业病，不是撒谎。"],
];

/* [名字, 相对时间, 句数, 正文预览] —— 预览这一列真机上来自
   /api/characters/chats 返回的最后一条消息，接口没给就整列不显示。 */
const CHATS = [
  ["雨夜的第二封信","14:32",49,"你的还没写。这一幕留白，等你自己填。"],
  ["灯塔看守人","昨天",22,"塔顶的灯每转一圈要四十二秒，我数过一整夜。"],
  ["八月三日的排练","2 天",7,"第三次读同一段台词，还是不对。"],
  ["没有观众的返场","5 天",88,"灯亮了一半，我就当全场都在。"],
  ["南站，末班车之后","1 周",15,"站台上只剩广播还在说话。"],
  ["给缺席者的独白","3 周",41,"这段是写给不来的人的，所以可以说得直白些。"],
];
const CHARS = ["Elias","守夜人","无名氏"];

const AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23c9c9c4'/%3E%3C/svg%3E";
const START = new Date(2026, 7, 4, 14, 2);

/* ---- 会话列表 ---- */
const recents = document.querySelector(".clawd-rail-recents");
const recentList = document.createElement("div");
recentList.className = "recentChatList";
recentList.dataset.clawdOwned = "1";
recents.appendChild(recentList);
CHATS.forEach(([name, date], i) => {
  const row = document.createElement("div");
  row.className = "recentChat" + (i === 0 ? " is-current" : "");
  row.dataset.file = name; row.dataset.avatar = ""; row.dataset.group = "";
  row.innerHTML =
    '<div class="avatar"><img src="' + AVATAR + '"></div>'
  + '<div class="recentChatInfo">'
  +   '<div class="chatNameContainer">'
  +     '<div class="chatName"><strong class="characterName">' + CHARS[i % CHARS.length]
  +       '</strong><span>–</span><span>' + name + '</span></div>'
  +     '<small class="chatDate">' + date + '</small>'
  +     '<div class="chatActions"></div>'
  +     '<div class="chatPreview">' + CHATS[i][3] + '</div>'
  +   '</div>'
  + '</div>';
  recentList.appendChild(row);
});

/* ---- 一条消息的真实 DOM。**照抄，不要简化。** ---- */
function buildMes(i, [who, name, text]) {
  const isUser = who === "me";
  const t = new Date(START.getTime() + i * 97000);
  const hhmm = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
  const stamp = "August 4, 2026 " + hhmm + (t.getHours() >= 12 ? " PM" : " AM");
  const tok = Math.round(text.replace(/<[^>]+>/g,"").length * 1.6) + 12;

  const el = document.createElement("div");
  el.className = "mes";
  el.setAttribute("mesid", String(i));
  el.setAttribute("ch_name", name);
  el.setAttribute("is_user", String(isUser));
  el.setAttribute("is_system", "false");
  el.setAttribute("swipeid", "0");
  el.setAttribute("force_avatar", "true");
  el.setAttribute("timestamp", stamp);

  el.innerHTML =
    '<div class="for_checkbox"></div>'
  + '<input type="checkbox" class="del_checkbox">'
  + '<div class="mesAvatarWrapper">'
  +   '<div class="avatar"><img src="' + AVATAR + '"></div>'
  +   '<div class="mesIDDisplay">#' + i + '</div>'
  +   '<div class="mes_timer">' + (isUser ? "" : "8.4s") + '</div>'
  +   '<div class="tokenCounterDisplay">' + tok + ' tok</div>'
  + '</div>'
  + '<div class="swipe_left fa-solid fa-chevron-left interactable" style="display:none;" tabindex="0" role="button"></div>'
  + '<div class="mes_block">'
  +   '<div class="ch_name flex-container justifySpaceBetween alignItemsBaseline">'
  +     '<span class="name_text">' + name + '</span>'
  +     '<div class="mes_buttons">'
  +       '<div class="mes_edit fa-solid fa-pencil interactable" tabindex="0"></div>'
  +       '<div class="mes_hide fa-solid fa-eye-slash interactable" tabindex="0"></div>'
  +       '<div class="extraMesButtonsHint fa-solid fa-ellipsis interactable" tabindex="0"></div>'
  +     '</div>'
  +     '<span class="timestamp">' + stamp + '</span>'
  +   '</div>'
  +   '<div class="mes_text">'
  /* 酒馆把消息里的空行渲染成多个 <p>。fixture 也要拆，不然段距那一档
     根本测不到 —— 单段文本下 .mes_text > p 的 margin 是看不出来的。 */
  +     text.split("\n\n").map(p => '<p>' + p + '</p>').join('')
  +   '</div>'
  + '</div>'
  + '<div class="flex-container swipeRightBlock flexFlowColumn flexNoGap"></div>';
  return el;
}

const chat = document.getElementById("chat");
SEED.forEach((m, i) => chat.appendChild(buildMes(i, m)));
</script>
</body>
</html>
