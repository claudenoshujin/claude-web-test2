<!-- ============================================================
     本地验证台。

     用途：把 styles/*.css 挂在一份**照抄真实酒馆 DOM** 的静态骨架上，
     在浏览器里直接改直接看，不用打包、不用重装扩展、不用等 lulu 截图。

     DOM 来源：真实酒馆的 devtools 快照 + 交接文档 §3.2 / §3.3 的结构记录。
     凡是 CSS 选择器会命中的属性和类名，这里都要有 —— 少一个 class，
     就会出现「fixture 里对了、装上去不对」，那样这个台子就白搭了。

     踩过两次，记在这里：
      · 导航项的 id 必须和真机一致（预设=ai-config-button，API=sys-settings-button，
        角色卡=rightNavHolder）。id 对不上就落到没有 --clawd-icon 的兜底分支，
        遮罩失效露出底色 —— 表现是导航里冒出一个黑方块，而真机上根本没有。
      · .clawd-user-meta 里**只有两行文字**，没有头像。之前塞了个 .avatar>img，
        没有任何规则约束尺寸，撑成一个 190×290 的大灰块。

     playbill 的导航（.cw-nav）、封面（.cw-cover）、幕次条（.cw-act）
     在真机上由 index.js 生成。这里是同一份结构的静态复制 ——
     改 index.js 里的生成逻辑要同步改这里，否则两边会漂开。
     ============================================================ -->

<script>
/* ============================================================

   这样 fixture 和参考稿放在一起比对时，字是同一批字，

/* 种子数据。**长度要贴近真实使用**：酒馆里一条 AI 回复通常是两三段、
   带动作描写和对话，不是参考稿演示用的那种一句话台词。
   短句样例会让排版看起来比实际宽松得多 —— 行距、段距、左边注和正文的
   基线关系，全都要在长文本下才看得出问题。 */
const SEED = [
  ["ai","Elias","你把伞放在门口了。滴水的声音一直在往里走，顺着地板的木缝，一路走到我脚边。<em>他没有起身，只是把手里那本翻旧了的排练本合上，放在膝盖上。</em>\n\n这个剧场的地板是斜的，你大概没注意。所有落在门口的水，最后都会流到这张椅子底下来。三年前我修过一次，修完之后水改从另一边流，我就不修了。"],
  ["me","安河","我以为这场雨会停。走到半路才发现越下越大，回头也来不及了。"],
  ["ai","Elias","它不会。这座城市里，雨是唯一守时的演员——该来的时候一定来，该走的时候从来不走。<em>他拨了拨工作灯，光圈在幕布上晃了一下，又稳住。</em>\n\n你要是想等它停，可以坐下。这里没有别人，椅子随便挑。第七排靠边那个位置弹簧坏了，坐上去会响一声，除此之外都还行。"],

  ["ai","Elias","还在我口袋里。<em>他拍了拍胸前的位置，没有掏出来。</em>写完之后我读了六遍，每一遍都少一句。不是我删的，是读到那儿会自己跳过去，像台词背到一半忘了词，但你知道那句原本在那儿。"],
  ["me","安河","少的是哪一句。"],
  ["ai","Elias","第一遍少的是称呼。第六遍少的是署名。中间那四遍少的东西我记不清了，因为每次都不一样。\n\n你要问我这算不算把信写坏了——我觉得不算。一封信如果读六遍都不掉字，那说明它写的是别人的事。"],
  ["me","安河","那还剩什么。"],
  ["ai","Elias","剩下一段没有人称的句子。听上去像天气预报，或者车站广播，反正是那种谁听见都可以、谁听见都不用回应的东西。"],

  ["me","安河","于是你替它写讣告。"],
  ["ai","Elias","我替它排了一出戏。没人来看，但灯每晚都亮，从八点到十一点，一分钟不差。<em>他把排练本又打开，翻到中间某一页，那一页写满了字又划掉大半。</em>\n\n你要是问我这有什么用，我答不上来。但你今天来了，所以今晚这三个小时不算白亮。"],
  ["me","安河","那是给谁看的。"],
  ["ai","Elias","给还在路上的人。<em>停顿。他没有看向门口，但显然在听雨声。</em>也给已经不来的人。后面这一类比前面那一类多得多，可是没办法，名单是不能删的。"],
  ["me","安河","我今天来了。"],
  ["ai","Elias","我知道。所以今晚的灯比平时亮一档。<em>他伸手把工作灯的旋钮又拧了一点，光圈铺开，照到第七排。</em>\n\n别说这句写得太像台词。我知道它像。但站在舞台上的人说什么都像台词，这是职业病，不是撒谎。"],

/* [名字, 相对时间, 句数, 正文预览] —— 预览这一列真机上来自
   /api/characters/chats 返回的最后一条消息，接口没给就整列不显示。 */
const CHATS = [
  ["雨夜的第二封信","14:32",49,"你的还没写。这一幕留白，等你自己填。"],
  ["灯塔看守人","昨天",22,"塔顶的灯每转一圈要四十二秒，我数过一整夜。"],
  ["八月三日的排练","2 天",7,"第三次读同一段台词，还是不对。"],
  ["没有观众的返场","5 天",88,"灯亮了一半，我就当全场都在。"],
  ["南站，末班车之后","1 周",15,"站台上只剩广播还在说话。"],
  ["给缺席者的独白","3 周",41,"这段是写给不来的人的，所以可以说得直白些。"],
];
const CHARS = ["Elias","守夜人","无名氏"];

const AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23c9c9c4'/%3E%3C/svg%3E";
const START = new Date(2026, 7, 4, 14, 2);

/* 剧场配图。真机上是用户在设置里传的图（localStorage 的 claude-web:pbImage）。
   fixture 里用一张占位渐变图，只是为了看清"图 + 底部渐变"这套排法。
   设成 "" 就能看没有配图时的兜底（一条渐变横条）。 */
const PB_ART = "data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20800%20470'%3E%0A%3Crect%20width%3D'800'%20height%3D'470'%20fill%3D'%23050505'%2F%3E%0A%3Crect%20x%3D'122'%20y%3D'72'%20width%3D'242'%20height%3D'328'%20fill%3D'%23b9c58f'%2F%3E%0A%3Crect%20x%3D'137'%20y%3D'88'%20width%3D'212'%20height%3D'44'%20fill%3D'none'%20stroke%3D'%233e4b32'%20stroke-width%3D'2'%2F%3E%0A%3Ctext%20x%3D'243'%20y%3D'172'%20text-anchor%3D'middle'%20font-family%3D'Arial'%20font-size%3D'34'%20fill%3D'%23eef0dc'%3ESECOND%20LETTER%3C%2Ftext%3E%0A%3Ctext%20x%3D'243'%20y%3D'202'%20text-anchor%3D'middle'%20font-family%3D'Arial'%20font-size%3D'11'%20fill%3D'%23293022'%3EARCHIVE%20%2F%20RAIN%20%2F%20STAGE%3C%2Ftext%3E%0A%3Cpath%20d%3D'M242%20240%20C185%20262%20185%20330%20242%20358%20C300%20330%20300%20262%20242%20240Z'%20fill%3D'none'%20stroke%3D'%23eef0dc'%20stroke-width%3D'2'%2F%3E%0A%3Cpath%20d%3D'M242%20244V355M188%20292H296M205%20265L279%20334M279%20265L205%20334'%20stroke%3D'%23eef0dc'%20stroke-width%3D'1'%2F%3E%0A%3Ccircle%20cx%3D'243'%20cy%3D'300'%20r%3D'4'%20fill%3D'%23eef0dc'%2F%3E%0A%3Cg%20transform%3D'translate(455%20116)%20rotate(15)'%3E%0A%20%3Crect%20width%3D'82'%20height%3D'280'%20rx%3D'3'%20fill%3D'%23f6f6f2'%2F%3E%3Ctext%20x%3D'20'%20y%3D'38'%20font-family%3D'Arial'%20font-size%3D'17'%20fill%3D'%23111'%20transform%3D'rotate(90%2020%2038)'%3ETHIS%20SCENE%20IS%20A%20GIFT%3C%2Ftext%3E%0A%3C%2Fg%3E%0A%3Cg%20transform%3D'translate(552%20142)%20rotate(27)'%3E%0A%20%3Crect%20width%3D'78'%20height%3D'250'%20rx%3D'3'%20fill%3D'%23f6f6f2'%2F%3E%3Ctext%20x%3D'18'%20y%3D'36'%20font-family%3D'Arial'%20font-size%3D'15'%20fill%3D'%23111'%20transform%3D'rotate(90%2018%2036)'%3EARE.NA%20%2F%20CONVERSATION%3C%2Ftext%3E%0A%3C%2Fg%3E%0A%3Cellipse%20cx%3D'548'%20cy%3D'74'%20rx%3D'25'%20ry%3D'17'%20fill%3D'%238b7048'%20transform%3D'rotate(12%20548%2074)'%2F%3E%0A%3Cpath%20d%3D'M535%2072c8-9%2019-8%2027%200-8%207-18%209-27%200Z'%20fill%3D'%23b6955c'%2 /* ---- 这三样必须和 index.js 里的实现保持一致 ---- */
/* 一问一答算一幕：用户发一条 + 角色回一条 = Act I。所以幕数 = 用户消息条数。 */
const pbActsOf = (userTurns) => Math.max(1, userTurns);
const PB_LINES = {
  dawn:  ['天快亮了。清场的人还没来。','晨光从侧幕漏进来，落在没收的道具上。','第一班车的声音穿过后台。','灯还亮着，但已经不需要了。'],
  day:   ['白天的剧场，谁都看得见灰。','排练厅。窗开着，外面有人在搬东西。','空场。只有你和回声。','午后。幕布上有一道晒出来的印子。'],
  dusk:  ['开演前二十分钟。走廊里有脚步声。','天色刚暗下来，灯正在预热。','检票的声音停了。','侧幕的风比刚才凉。'],
  night: ['雨。旧剧场后台，只有一盏工作灯。','深夜。观众席空着，灯只亮了一半。','这个点还留在剧场里的，都不是来看戏的。','落幕之后。没有人起身。'],
};
function pbSlot(d){const h=(d||new Date()).getHours();
  return h<6?'night':h<11?'dawn':h<17?'day':h<22?'dusk':'night';}
function pbLine(seed,when){const p=PB_LINES[pbSlot(when)];return p[Math.abs(seed)%p.length];}
function roman(n){const t=[[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];let s="";
  for(const [v,r] of t){while(n>=v){s+=r;n-=v;}}return s||"I";}

/* ---- 一条消息的真实 DOM。**照抄，不要简化。** ---- */
function buildMes(i, [who, name, text]) {
  const isUser = who === "me";
  const t = new Date(START.getTime() + i * 97000);
  const hhmm = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
  const stamp = "August 4, 2026 " + hhmm + (t.getHours() >= 12 ? " PM" : " AM");
  const tok = Math.round(text.replace(/<[^>]+>/g,"").length * 1.6) + 12;
  const swipes = isUser ? 0 : 2 + (i % 3);
  const cur = isUser ? 0 : 1 + (i % swipes);

  const el = document.createElement("div");
  el.className = "mes";
  el.setAttribute("mesid", String(i));
  el.setAttribute("ch_name", name);
  el.setAttribute("is_user", String(isUser));
  el.setAttribute("is_system", "false");
  el.setAttribute("swipeid", "0");
  el.setAttribute("force_avatar", "true");
  el.setAttribute("timestamp", stamp);
  el.dataset.time = hhmm;                                  /* stampMessages() 写的 */
  el.dataset.swipe = swipes > 1 ? (cur + "/" + swipes) : "";

  el.innerHTML =
    '<div class="for_checkbox"></div>'
  + '<input type="checkbox" class="del_checkbox">'
  + '<div class="mesAvatarWrapper">'
  +   '<div class="avatar"><img src="' + AVATAR + '"></div>'
  +   '<div class="mesIDDisplay">#' + i + '</div>'
  +   '<div class="mes_timer">' + (isUser ? "" : "8.4s") + '</div>'
  +   '<div class="tokenCounterDisplay">' + tok + ' tok</div>'
  + '</div>'
  + '<div class="swipe_left fa-solid fa-chevron-left interactable" style="display:none;" tabindex="0" role="button"></div>'
  + '<div class="mes_block">'
  +   '<div class="ch_name flex-container justifySpaceBetween alignItemsBaseline">'
  +     '<span class="name_text">' + name + '</span>'
  +     '<div class="mes_buttons">'
  +       '<div class="mes_edit fa-solid fa-pencil interactable" tabindex="0"></div>'
  +       '<div class="mes_hide fa-solid fa-eye-slash interactable" tabindex="0"></div>'
  +       '<div class="extraMesButtonsHint fa-solid fa-ellipsis interactable" tabindex="0"></div>'
  +     '</div>'
  +     '<span class="timestamp">' + stamp + '</span>'
  +   '</div>'
  +   '<div class="mes_text" data-speaker="' + name + '">'
  /* 酒馆把消息里的空行渲染成多个 <p>。fixture 也要拆，不然段距那一档
     根本测不到 —— 单段文本下 .mes_text > p 的 margin 是看不出来的。 */
  +     text.split("\n\n").map(p => '<p>' + p + '</p>').join('')
  +   '</div>'
  + '</div>'
  + '<div class="flex-container swipeRightBlock flexFlowColumn flexNoGap"></div>';
  return el;
}

/* ---- 每条消息的头。和 index.js 的 buildCards() 是同一套规则 ----
   细线 / 标语 / 头像 / 名字，全部居中；幕号只在换幕时打在线上。 */
const PB_ACTS = [];
(function buildCards(){
  let act = 0;
  [...chat.querySelectorAll(":scope > .mes")].forEach(mes => {
    /* 一问一答算一幕：用户发一条就开一幕，角色的回答归在同一幕里。
       开场白（第一条不是用户发的）算 Act I 的开头，不单独占一幕。 */
    const isUser = mes.getAttribute("is_user") === "true";
    let isNewAct = false;
    if (isUser) { act += 1; isNewAct = true; }
    else if (act === 0) { act = 1; isNewAct = true; }

    const id = Number(mes.getAttribute("mesid")) || 0;
    const name = mes.getAttribute("ch_name") || "";
    const when = mes.dataset.time ? new Date("2000/01/01 " + mes.dataset.time) : null;
    const note = pbLine(id, when);
    const src = mes.querySelector(".mesAvatarWrapper .avatar img")?.getAttribute("src") || "";

    const head = document.createElement("div");
    head.className = "cw-card-head" + (isNewAct ? " is-act" : "");
    const tok = (mes.querySelector(".tokenCounterDisplay")?.textContent || "").trim();
    /* .mes_timer 装的是生成耗时（8.4s），不是时刻。 */
    const dur = (mes.querySelector(".mes_timer")?.textContent || "").trim();
    const meta = [mes.dataset.time, dur, mes.dataset.swipe, tok]
      .filter(Boolean).join("&nbsp;&nbsp;·&nbsp;&nbsp;");
    head.innerHTML =
      '<div class="cw-card-bar">'
    +   (isNewAct ? '<span class="cw-act-no">Act ' + roman(act) + '</span>' : '')
    + '</div>'
    + '<div class="cw-card-note">' + note + '</div>'
    /* 头像 / 名字 / 元数据各占一行，全部居中。合成一行会让头像左右飘 ——
       元数据长短不一，整组宽度就不一样。和 index.js 的 buildCards() 一致。 */
    + (src ? '<img class="cw-card-face" src="' + src + '" alt="">' : '')
    + '<div class="cw-card-name">' + name + '</div>'
    + '<div class="cw-card-meta">' + meta + '</div>';
    mes.insertBefore(head, mes.firstChild);

    /* 编辑 / 删除：纯文字，自建，常显居中。真机上点下去会转发到酒馆自己的按钮。 */
    const bar = document.createElement("div");
    bar.className = "cw-msg-acts";
    bar.innerHTML = '<button type="button" data-act="edit">编辑</button>'
      + '<button type="button" data-act="del">删除</button>';
    mes.appendChild(bar);
    PB_ACTS.push({ no: act, roman: roman(act), note, el: mes, isNew: isNewAct });
  });
})();

/* ---- 栏宽拖拽把手。和 index.js 的 pbWatchRails() 是同一套结构 ----
   三条竖缝上各一个，平时看不见，鼠标压上去才出一条细线。
   fixture 里只做拖动本身，不存 localStorage —— 存了会跨次残留，
   下次打开看到的就不是默认值，那样这个台子就不能用来判断默认值好不好。 */
(function rails(){
  const DEF = { nav:176, list:250, cast:220 };
  const MIN = { nav:150, list:220, cast:190 };
  const MAX = { nav:360, list:560, cast:460 };
  const CHAT_MIN = 420;
  let w = { ...DEF };
  const apply = () => {
    const st = document.documentElement.style;
    st.setProperty("--cw-c-nav",  w.nav  + "px");
    st.setProperty("--cw-c-list", w.list + "px");
    st.setProperty("--cw-c-cast", w.cast + "px");
  };
  apply();
  for (const col of ["nav","list","cast"]) {
    const g = document.createElement("div");
    g.className = "cw-rail-grip"; g.dataset.col = col;
    g.title = "拖动改变栏宽 · 双击还原";
    document.body.appendChild(g);
    let x0 = 0, w0 = 0;
    g.addEventListener("pointerdown", e => {
      x0 = e.clientX; w0 = w[col];
      g.setPointerCapture(e.pointerId); g.classList.add("is-drag");
      document.documentElement.classList.add("cw-rail-dragging");
      e.preventDefault();
    });
    g.addEventListener("pointermove", e => {
      if (!g.classList.contains("is-drag")) return;
      /* 右栏在右边，往左拖是变宽，方向反过来。 */
      const dx = (col === "cast" ? -1 : 1) * (e.clientX - x0);
      const others = ["nav","list","cast"].filter(k => k !== col).reduce((t,k) => t + w[k], 0);
      let next = Math.min(MAX[col], Math.max(MIN[col], Math.round(w0 + dx)));
      next = Math.max(MIN[col], Math.min(next, window.innerWidth - others - CHAT_MIN));
      w = { ...w, [col]: next };
      apply();
    });
    const end = () => {
      g.classList.remove("is-drag");
      document.documentElement.classList.remove("cw-rail-dragging");
    };
    g.addEventListener("pointerup", end);
    g.addEventListener("pointercancel", end);
    g.addEventListener("dblclick", () => { w = { ...w, [col]: DEF[col] }; apply(); });
  }
})();

/* ---- 三个轴的现场切换 ---- */
const CYCLE = {
  skin:      ["playbill", "arena", "classic"],
  structure: ["linear", "rail"],
  avatars:   ["on", "off"],
};
document.querySelector(".fx-toolbar").addEventListener("click", e => {
  const key = e.target.dataset.fx;
  if (!key) return;
  if (key === "reload") {
    const link = document.querySelector('link[rel=stylesheet]');
    link.href = link.href.split("?")[0] + "?t=" + Date.now();
    return;
  }
  const attr = "claude" + key[0].toUpperCase() + key.slice(1);
  const list = CYCLE[key];
  const next = list[(list.indexOf(document.documentElement.dataset[attr]) + 1) % list.length];
  document.documentElement.dataset[attr] = next;
  e.target.textContent = key + ": " + next;
});
